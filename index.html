<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Merriweather:wght@300;400;700;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .font-serif {
      font-family: 'Merriweather', serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Screen reader only - for accessibility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* A4 Page visualization for screen */
    .page-break-indicator {
      position: relative;
      height: 0;
      border-top: 2px dashed #3b82f6;
      margin: 0 -0.5in;
      opacity: 0.3;
    }

    .page-break-indicator::after {
      content: 'Page Break';
      position: absolute;
      top: -10px;
      right: 10px;
      background: #3b82f6;
      color: white;
      padding: 2px 8px;
      font-size: 10px;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
    }

    /* Resume page styling is now in index.css */
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>

</body>

</html>
